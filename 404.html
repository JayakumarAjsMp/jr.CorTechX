<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0d0d0f" />
  <title>404 — Page Not Found | jr.CorTechX</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <style>
    .notfound {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .notfound::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,34,68,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .notfound__code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: 900;
      line-height: 1;
      color: var(--clr-red);
      opacity: 0.15;
      letter-spacing: -0.05em;
      position: absolute;
      user-select: none;
    }
    .notfound__content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .notfound__tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--clr-red);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid rgba(255,34,68,0.2);
      background: rgba(255,34,68,0.08);
      padding: 0.3em 1em;
      border-radius: 9999px;
    }
    .notfound__title {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 900;
      color: var(--clr-white);
      letter-spacing: -0.03em;
    }
    .notfound__desc {
      font-size: 1rem;
      color: var(--clr-text-muted);
      max-width: 40ch;
      line-height: 1.7;
    }
    .notfound__actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }
    .notfound__counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--clr-text-muted);
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="notfound">
    <span class="notfound__code" aria-hidden="true">404</span>
    <div class="notfound__content">
      <span class="notfound__tag">Error 404</span>
      <h1 class="notfound__title">Page Not Found</h1>
      <p class="notfound__desc">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div class="notfound__actions">
        <a href="/" class="btn btn--primary">← Back to Home</a>
        <a href="/#contact" class="btn btn--ghost">Contact Us</a>
      </div>
      <p class="notfound__counter" id="counter">Redirecting to home in <span id="secs">10</span>s…</p>
    </div>
  </div>

  <script>
    let s = 10;
    const el = document.getElementById('secs');
    const t = setInterval(() => {
      s--;
      if (el) el.textContent = s;
      if (s <= 0) { clearInterval(t); window.location.href = '/'; }
    }, 1000);
  </script>
</body>
</html>
